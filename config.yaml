# Path to your Kingdom Come: Deliverance installation
# Common locations on Linux:
#   - ~/.steam/steam/steamapps/common/KingdomComeDeliverance
#   - ~/.local/share/Steam/steamapps/common/KingdomComeDeliverance
#   - ~/.var/app/com.valvesoftware.Steam/.local/share/Steam/steamapps/common/KingdomComeDeliverance
# Leave empty for auto-detection on first run
GamePath: ""

# Path to your Mods folder (usually [GamePath]/Mods)
# Leave empty for auto-detection on first run
ModsPath: ""

# Name of the merged mod folder (created in ModsPath)
# Default: KCDMerge
OutputPath: "KCDMerge"

# Whether to overwrite the output directory if it exists
# Default: true
OverwriteOutput: true

# Automatically open the log file after merge completes
# Default: false
OpenLogFileAfterMerge: false

# Number of log files to keep (0 = keep all)
# Default: 3
LogRetentionCount: 3

# Minimum log level written to the .log file
# Valid values: Verbose, Debug, Information, Warning, Error
# Default: Information
FileLogLevel: "Information"

# Temporary directory for staging files during merge
# On Linux: /tmp/KCDMerge
# Default: %TEMP%\KCDMerge (automatically resolved to /tmp/KCDMerge on Linux)
TempPath: "%TEMP%\\KCDMerge"

# Clean up temporary files after successful merge
# Default: true
TempCleanUp: true

# Output mode for merged table XML files: "PTF" (Recommended) or "Full"
# Default: PTF
OutputMode: "PTF"

# Staleness check mode: Off, WarnOnly, Prompt
# Default: WarnOnly
StalenessCheckMode: "WarnOnly"

# List of mods to always prompt for staleness decisions
StalenessCheckMods: []
